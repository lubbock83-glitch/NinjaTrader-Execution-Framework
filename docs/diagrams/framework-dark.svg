<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Framework composition: four custom bar types feed a MasterTerminalBase host that owns the control surface, regime scanner, optimiser and Monte Carlo risk simulation, and six strategies implement only their trading idea against its extension contract."><defs><marker id="a-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9a84a"/></marker><marker id="a-cs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6cb6e8"/></marker></defs><rect width="1000" height="520" fill="#0d1117"/><text x="32" y="42" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Framework composition</text><text x="32" y="64" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9198a1">One execution stack, six trading ideas. Strategies differ because the ideas differ, not because the plumbing does.</text><text x="32" y="106" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#9198a1">BAR CONSTRUCTION</text><rect x="32" y="118" width="158" height="44" rx="5" fill="#161b22" stroke="#30363d"/><text x="111" y="145" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e6edf3">PrecisionWickRenko</text><rect x="204" y="118" width="158" height="44" rx="5" fill="#161b22" stroke="#30363d"/><text x="283" y="145" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e6edf3">RenkoWithWicks</text><rect x="376" y="118" width="158" height="44" rx="5" fill="#161b22" stroke="#30363d"/><text x="455" y="145" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e6edf3">ATRMeanRenko</text><rect x="548" y="118" width="158" height="44" rx="5" fill="#161b22" stroke="#30363d"/><text x="627" y="145" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e6edf3">LevelRenko</text><text x="748" y="146" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">true wicks preserved, so</text><text x="748" y="162" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">MAE/MFE are real</text><line x1="350" y1="170" x2="350" y2="202" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a-d)"/><text x="350" y="177" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#9198a1">bars</text><rect x="32" y="206" width="936" height="128" rx="7" fill="#2a2415" stroke="#d9a84a" stroke-width="2"/><text x="52" y="234" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#d9a84a">MasterTerminalBase</text><text x="52" y="254" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#9198a1">abstract Strategy - owns everything that is not the trading idea</text><rect x="52" y="268" width="212" height="46" rx="5" fill="#0d1117" stroke="#30363d"/><text x="158" y="288" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e6edf3">WPF control surface</text><text x="158" y="304" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#9198a1">order + position state</text><rect x="280" y="268" width="212" height="46" rx="5" fill="#0d1117" stroke="#30363d"/><text x="386" y="288" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e6edf3">Regime scanner</text><text x="386" y="304" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#9198a1">3-day session isolated</text><rect x="508" y="268" width="212" height="46" rx="5" fill="#0d1117" stroke="#30363d"/><text x="614" y="288" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e6edf3">Parameter optimiser</text><text x="614" y="304" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#9198a1">strategy-declared space</text><rect x="736" y="268" width="212" height="46" rx="5" fill="#0d1117" stroke="#30363d"/><text x="842" y="288" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e6edf3">Monte Carlo risk</text><text x="842" y="304" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#9198a1">trailing-drawdown pass rate</text><line x1="350" y1="342" x2="350" y2="378" stroke="#d9a84a" stroke-width="1.6" marker-end="url(#a-acc)"/><text x="350" y="351" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#d9a84a">implements 6 hooks</text><text x="32" y="372" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#9198a1">TRADING IDEAS</text><rect x="32" y="384" width="143" height="52" rx="5" fill="#161b22" stroke="#30363d"/><text x="103" y="405" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#e6edf3">KeltnerRenkoV3</text><text x="103" y="423" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" fill="#d9a84a">Breakout</text><rect x="189" y="384" width="143" height="52" rx="5" fill="#161b22" stroke="#30363d"/><text x="260" y="405" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#e6edf3">FailedAuctionModel</text><text x="260" y="423" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" fill="#d9a84a">Reversal</text><rect x="346" y="384" width="143" height="52" rx="5" fill="#161b22" stroke="#30363d"/><text x="417" y="405" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#e6edf3">CVD_Absorption</text><text x="417" y="423" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" fill="#d9a84a">Mean-Rev</text><rect x="503" y="384" width="143" height="52" rx="5" fill="#161b22" stroke="#30363d"/><text x="574" y="405" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#e6edf3">RegimeExpansion</text><text x="574" y="423" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" fill="#d9a84a">Breakout</text><rect x="660" y="384" width="143" height="52" rx="5" fill="#161b22" stroke="#30363d"/><text x="731" y="405" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#e6edf3">TSMOM_VolNorm</text><text x="731" y="423" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" fill="#d9a84a">Breakout</text><rect x="817" y="384" width="143" height="52" rx="5" fill="#161b22" stroke="#30363d"/><text x="888" y="405" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#e6edf3">TPO_ValueArea</text><text x="888" y="423" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" fill="#d9a84a">Mean-Rev</text><rect x="32" y="458" width="240" height="40" rx="5" fill="#16242f" stroke="#6cb6e8"/><text x="152" y="483" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6cb6e8">RegimeFilter - what the market is</text><text x="292" y="483" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">paired against GetStrategyDNA - what an idea needs - so the host can tell</text><text x="292" y="499" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">whether a strategy is being run in the conditions it was designed for.</text></svg>