<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Execution path: a signal travels from TradingView through a Python research engine, across a loopback TCP boundary into the SignalBridge indicator inside NinjaTrader 8, which places the bracket and runs the trailing stop state machine before routing to the broker."><defs><marker id="a-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9a84a"/></marker><marker id="a-cs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6cb6e8"/></marker></defs><rect width="1000" height="470" fill="#0d1117"/><text x="32" y="42" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Execution path</text><text x="32" y="64" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9198a1">Where the trade decision is made, and where it is managed - deliberately not the same place.</text><rect x="24" y="116" width="168" height="118" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="108" y="146" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">TradingView</text><text x="108" y="168" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">Pine strategy</text><text x="108" y="185" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">emits the alert</text><rect x="236" y="116" width="196" height="118" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="334" y="146" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Python engine</text><text x="334" y="168" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">signal, sizing,</text><text x="334" y="185" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">parameter search</text><rect x="560" y="116" width="212" height="118" rx="6" fill="#2a2415" stroke="#d9a84a" stroke-width="2"/><text x="666" y="146" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#d9a84a">SignalBridge</text><text x="666" y="168" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">NinjaScript Indicator</text><text x="666" y="185" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">C# - this repo</text><rect x="816" y="116" width="160" height="118" rx="6" fill="#16242f" stroke="#6cb6e8" stroke-width="1"/><text x="896" y="146" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#6cb6e8">NinjaTrader 8</text><text x="896" y="168" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">account</text><text x="896" y="185" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">and broker</text><line x1="496" y1="92" x2="496" y2="392" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 5"/><text x="496" y="84" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#9198a1">process boundary</text><text x="496" y="410" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#9198a1">loopback TCP 127.0.0.1 - never exposed to a network</text><line x1="196" y1="162" x2="232" y2="162" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a-d)"/><text x="214" y="153" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#9198a1">alert</text><line x1="436" y1="162" x2="556" y2="162" stroke="#d9a84a" stroke-width="1.6" marker-end="url(#a-acc)"/><text x="496" y="153" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#d9a84a">order + exit geometry (JSON)</text><line x1="776" y1="162" x2="812" y2="162" stroke="#6cb6e8" stroke-width="1.6" marker-end="url(#a-cs)"/><text x="794" y="153" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#6cb6e8">bracket</text><line x1="812" y1="204" x2="776" y2="204" stroke="#6cb6e8" stroke-width="1.6" marker-end="url(#a-cs)"/><text x="794" y="221" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#6cb6e8">fills</text><line x1="556" y1="204" x2="436" y2="204" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a-d)"/><text x="496" y="221" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#9198a1">fills + P&amp;L telemetry, 1/s</text><rect x="560" y="286" width="416" height="86" rx="6" fill="#2a2415" stroke="#d9a84a" stroke-width="1.5"/><text x="578" y="310" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#d9a84a">3-phase trailing stop runs on this side</text><text x="578" y="331" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">Static to breakeven to ratchet, next to the order rather than across</text><text x="578" y="348" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">the socket. If the research process dies mid-trade the position is</text><text x="578" y="365" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">still managed, because the exit rules travelled with the order.</text><text x="32" y="446" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">The same state machine is mirrored in the Python backtester, so research results describe the exits the live account will actually take.</text></svg>