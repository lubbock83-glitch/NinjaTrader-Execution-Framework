<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="1000" height="476" role="img" aria-label="The three-phase exit state machine: a position starts with a static stop, jumps to breakeven once the high-water mark reaches a configured fraction of the target, and then optionally ratchets a fixed brick distance behind the high-water mark. Three exit modes select how far along this chain a trade travels."><defs><marker id="s-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6c16"/></marker></defs><rect width="1000" height="476" fill="#ffffff"/><text x="32" y="42" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#11181f">Exit state machine</text><text x="32" y="64" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#54606d">Brick-based, not ATR-based. The same three phases run in C# live and in Python offline.</text><rect x="40" y="104" width="220" height="108" rx="7" fill="#f4f6f8" stroke="#c3ccd6" stroke-width="1"/><text x="150" y="136" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#11181f">Phase 1 — Static</text><text x="150" y="160" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#54606d">stop at entry ± sl_ticks</text><text x="150" y="177" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#54606d">held while MFE is below trigger</text><rect x="390" y="104" width="220" height="108" rx="7" fill="#f7efdd" stroke="#9a6c16" stroke-width="2"/><text x="500" y="136" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#9a6c16">Phase 2 — Breakeven</text><text x="500" y="160" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#54606d">stop jumps to entry ± be_offset</text><text x="500" y="177" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#54606d">risk removed, not reduced</text><rect x="740" y="104" width="220" height="108" rx="7" fill="#f7efdd" stroke="#9a6c16" stroke-width="2"/><text x="850" y="136" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#9a6c16">Phase 3 — Ratchet</text><text x="850" y="160" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#54606d">stop trails trailing_stop_bricks</text><text x="850" y="177" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#54606d">behind the high-water mark</text><text x="325" y="140" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#54606d">high-water mark reaches</text><text x="325" y="154" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#9a6c16">be_trigger_pct × tp_distance</text><line x1="264" y1="170" x2="386" y2="170" stroke="#9a6c16" stroke-width="1.8" marker-end="url(#s-arr)"/><text x="675" y="140" text-anchor="middle" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#54606d">only when exit_mode is</text><text x="675" y="154" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" fill="#9a6c16">Indicator_Ratchet</text><line x1="614" y1="170" x2="736" y2="170" stroke="#9a6c16" stroke-width="1.8" marker-end="url(#s-arr)"/><text x="32" y="264" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#54606d">HOW FAR EACH EXIT MODE TRAVELS</text><rect x="40" y="282" width="220" height="34" rx="5" fill="#e7f0f7" stroke="#1f5f8b" stroke-width="1.2"/><text x="54" y="304" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600" fill="#1f5f8b">Static_Only</text><text x="246" y="304" text-anchor="end" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#54606d">stop and target never move</text><rect x="40" y="326" width="570" height="34" rx="5" fill="#e7f0f7" stroke="#1f5f8b" stroke-width="1.2"/><text x="54" y="348" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600" fill="#1f5f8b">Static_BE_Jump</text><text x="596" y="348" text-anchor="end" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#54606d">stops at breakeven, no trail</text><rect x="40" y="370" width="920" height="34" rx="5" fill="#e7f0f7" stroke="#1f5f8b" stroke-width="1.2"/><text x="54" y="392" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" font-weight="600" fill="#1f5f8b">Indicator_Ratchet</text><text x="946" y="392" text-anchor="end" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#54606d">full chain, trails to the close</text><text x="32" y="462" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#54606d">The machine runs inside NinjaTrader rather than across the socket, so a position stays managed if the research process stops.</text></svg>